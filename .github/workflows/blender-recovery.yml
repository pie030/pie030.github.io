name: Recover editable Blender scenes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/blender-recovery.yml
      - tools/recover_blender_projects.py
      - tools/render_blender_qa.py
      - docs/BLENDER_RECOVERY.md
      - assets/*.glb

permissions:
  contents: read

jobs:
  recover:
    name: Convert GLB exports into Blender project files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out model assets
        uses: actions/checkout@v5
      - name: Install Blender from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -n 2
      - name: Import all three models and save Blender scenes
        run: blender --background --factory-startup --python-exit-code 1 --python tools/recover_blender_projects.py -- --output-dir blender
      - name: Verify recovered projects and generate manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          folder = Path("blender")
          report = json.loads((folder / "import_report.json").read_text(encoding="utf-8"))
          expected = {
              "Creekside_Cottage_Watchtower": (28, 15582, 14),
              "Coastal_Fishing_Hut_Pier": (49, 13718, 27),
              "Rural_Railway_Stop_Freight_Wagon": (64, 21722, 37),
          }
          assert set(report) == set(expected), f"Unexpected project list: {list(report)}"
          for name, record in report.items():
              path = folder / (name + ".blend")
              assert path.is_file(), f"Missing {path}"
              assert path.stat().st_size > 1000, f"Suspiciously small Blender file: {path}"
              assert path.open("rb").read(7) == b"BLENDER", f"Invalid .blend header: {path}"
              assert record["mesh_objects"] > 0 and record["polygons"] > 0
              actual = (record["mesh_objects"], record["triangles"], record["materials"])
              assert actual == expected[name], f"Unexpected mesh/triangle/material counts for {name}: {actual}"
              assert len(record["source_sha256"]) == 64
              assert record["blend_file"] == path.name
              print(f"OK {name}: {path.stat().st_size} bytes; {record['mesh_objects']} meshes; {record['polygons']} polygons")
          print("All three editable Blender scene files generated and checked.")
          PY
      - name: Render nine QA views of recovered Blender scenes
        run: blender --background --factory-startup --python-exit-code 1 --python tools/render_blender_qa.py -- --blend-dir blender --output-dir blender/qa
      - name: Verify QA render images and hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          root = Path("blender/qa")
          report = json.loads((root / "qa_report.json").read_text(encoding="utf-8"))
          assert len(report) == 3
          for name, record in report.items():
              assert set(record["views"]) == {"three_quarter", "opposite", "aerial"}
              for view, info in record["views"].items():
                  path = root / info["file"]
                  data = path.read_bytes()
                  assert data[:8] == b"\x89PNG\r\n\x1a\n"
                  assert struct.unpack_from(">II", data, 16) == (960, 600)
                  assert hashlib.sha256(data).hexdigest() == info["sha256"]
                  assert len(data) > 2000
                  print(f"QA image OK: {name} / {view} ({len(data)} bytes)")
          print("All nine Blender renders validated.")
          PY
      - name: Include opening instructions
        run: cp docs/BLENDER_RECOVERY.md blender/LEIA_ME.md
      - name: Upload recovered Blender scenes
        uses: actions/upload-artifact@v5
        with:
          name: blender-scenes-recovered
          path: |
            blender/*.blend
            blender/import_report.json
            blender/LEIA_ME.md
            blender/qa/*.png
            blender/qa/qa_report.json
          if-no-files-found: error
          retention-days: 14
