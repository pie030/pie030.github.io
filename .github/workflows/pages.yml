name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify portfolio
    # Playwright 1.57 supports Ubuntu 24.04; latest may resolve to unsupported 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site
        uses: actions/checkout@v5
      - name: Run static quality checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate recovery script syntax
        run: python3 -m py_compile tools/recover_blender_projects.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check js/site.js
          node --check js/model-preview.js
          node --check js/project-gallery.js
      - name: Prepare Chromium for browser smoke tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser-requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile and gallery interactions
        run: python tests/browser_smoke.py
      - name: Install pinned 3D viewer for real WebGL integration tests
        run: |
          mkdir -p /tmp/portfolio-viewer
          npm install --prefix /tmp/portfolio-viewer --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/model-viewer@3.5.0
      - name: Verify actual GLB rendering in software WebGL
        run: python tests/browser_webgl.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble allowlisted public website
        run: |
          python3 tools/build_public_site.py \
            --output "$RUNNER_TEMP/portfolio-public-site" \
            --viewer-bundle "/tmp/portfolio-viewer/node_modules/@google/model-viewer/dist/model-viewer.min.js" \
            --viewer-license "/tmp/portfolio-viewer/node_modules/@google/model-viewer/LICENSE"
      - name: Verify shipped GLBs in software WebGL
        env:
          PORTFOLIO_ROOT: ${{ runner.temp }}/portfolio-public-site
        run: python tests/browser_webgl.py
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: portfolio-browser-evidence
          path: |
            test-results/browser/
            test-results/webgl/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portfolio-public-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          endpoint = (
              os.environ["GH_API_URL"] + "/repos/" + os.environ["GH_REPOSITORY"]
              + "/actions/runs/" + os.environ["GH_RUN_ID"] + "/artifacts?per_page=100"
          )
          request = urllib.request.Request(endpoint, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          for attempt in range(15):
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response)["artifacts"]
              matches = [item for item in artifacts
                         if item["name"] == "github-pages" and not item["expired"]]
              if len(matches) == 1:
                  print("Pages artifact is available.")
                  break
              if len(matches) > 1:
                  raise SystemExit("Multiple Pages artifacts found; refusing an ambiguous deployment.")
              time.sleep(2)
          else:
              raise SystemExit("Pages artifact metadata did not become available.")
          PY
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
