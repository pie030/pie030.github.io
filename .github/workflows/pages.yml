name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Playwright 1.57 supports Ubuntu 24.04; latest may resolve to unsupported 26.04.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Run 12 static quality checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate recovery script syntax
        run: python3 -m py_compile tools/recover_blender_projects.py
      - name: Validate browser JavaScript syntax
        run: |
          node --check js/site.js
          node --check js/model-preview.js
          node --check js/project-gallery.js
      - name: Prepare Chromium for browser smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser-requirements.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile and gallery interactions
        run: python tests/browser_smoke.py
      - name: Install pinned 3D viewer for real WebGL integration tests
        run: |
          mkdir -p /tmp/portfolio-viewer
          npm install --prefix /tmp/portfolio-viewer --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/model-viewer@3.5.0
      - name: Verify actual GLB rendering in software WebGL
        run: python tests/browser_webgl.py
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: |
            test-results/browser/
            test-results/webgl/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
